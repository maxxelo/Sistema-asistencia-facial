server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS y CSS nunca en caché — el browser siempre pide la versión actual
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # Imágenes y fuentes: caché de 1 día (rara vez cambian)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Todo lo demás (HTML incluido): sin caché
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
