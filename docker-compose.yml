# define todos los contenedores que docker va a levantar
services:
  postgres:
    image: postgres:16
    container_name: colegio_db
    env_file: .env
    volumes:
      - colegio_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - red_interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d colegio_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Interfaz web para ver la BD ───────────────────────
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - red_interna
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

  # ─── API 1: Gestión académica (login, alumnos, cursos) ─
  api1:
    build: ./api1-academica
    container_name: api1_academica
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_interna
    restart: unless-stopped
    volumes:
      - ./api1-academica:/app          # Código del host → contenedor en tiempo real
      - /app/node_modules              # node_modules del contenedor (binarios Linux, no pisado por Windows)

  # ─── API 2: Asistencia ─────────────────────────────────
  api2:
    build: ./api2-asistencia
    container_name: api2_asistencia
    ports:
      - "3002:3002"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_interna
    restart: unless-stopped
    volumes:
      - ./api2-asistencia:/app
      - /app/node_modules

  # ─── API 3: Reconocimiento facial (WebSocket) ──────────
  api3:
    build: ./api3-facial
    container_name: api3_facial
    ports:
      - "3003:3003"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_interna
    restart: unless-stopped
    volumes:
      - ./api3-facial:/app
      - /app/node_modules

  # ─── API 4: Reportes ───────────────────────────────────
  api4:
    build: ./api4-reportes
    container_name: api4_reportes
    ports:
      - "3004:3004"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_interna
    restart: unless-stopped
    volumes:
      - ./api4-reportes:/app
      - /app/node_modules

  # ─── Frontend (http-server sirviendo index.html) ───────
  frontend:
    image: node:20-alpine
    container_name: frontend_web
    working_dir: /app
    command: sh -c "npm install -g http-server && http-server /app -p 3000 --cors -c-1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - red_interna
    restart: unless-stopped

networks:
  red_interna:
    driver: bridge
    internal: false

volumes:
  colegio_data:
