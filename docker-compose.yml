networks:
  red_interna:
    driver: bridge
    # Red tipo bridge — los contenedores se ven entre ellos
    internal: false
    # Red aislada — no tiene salida a internet
    # PostgreSQL no es accesible desde fuera de Docker

volumes:
  colegio_data:
  # Define el volumen persistente para los datos de PostgreSQL
  # Docker lo gestiona automáticamente