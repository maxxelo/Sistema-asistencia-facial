# define todos los contenedores que docker va a levantar
services:
  postgres:
    image: postgres:16
    # Usa la imagen oficial de PostgreSQL versión 16
    # Docker la descarga automáticamente si no la tienes
    
    container_name: colegio_db
    # El contenedor se llamará "colegio_db"
    
    env_file: .env
    # Lee las credenciales desde el archivo .env
    
    volumes:
      - colegio_data:/var/lib/postgresql/data
      # Guarda los datos de la BD en un volumen persistente
      # Si reinicias Docker, los datos NO se pierden
      
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Cuando PostgreSQL arranca por primera vez
      # ejecuta automáticamente el init.sql
      # Ahí se crearán las 30 tablas
    
    networks:
      - red_interna
      # Solo se comunica dentro de la red interna
      # No está expuesto al exterior

  # =====================================================
  #  INTERFAZ WEB PARA VER LA BASE DE DATOS
  # =====================================================
  adminer:
    image: adminer:latest
    # Herramienta liviana para administrar BD desde el navegador
    
    container_name: adminer
    # Nombre del contenedor
    
    ports:
      - "8080:8080"
    # Puerto 8080 de tu PC → interfaz web de Adminer
    # Abres http://localhost:8080 y ves las tablas
    
    networks:
      - red_interna
    # Se comunica con postgres dentro de la red interna
    
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    # Le dice a Adminer que se conecte al contenedor "postgres"
    
    restart: unless-stopped
    # Si se cierra, se reinicia solo

